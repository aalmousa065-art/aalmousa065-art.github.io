<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Download LAST EXIT</title><style>body{background:#10191c;color:#f4eedf;font:18px system-ui;max-width:620px;margin:12vh auto;padding:24px}button,a{color:inherit}button{background:#344d56;border:1px solid #dfbd79;padding:16px 24px;font:inherit;cursor:pointer}p{line-height:1.6}</style><h1>Take Port Mercer with you.</h1><p>Download the Windows edition, extract the ZIP, and open Last Exit.exe. Keep the game and its data file together.</p><button id="download">Download for Windows · 42 MB</button><p id="status" role="status"></p><a href="../">Back to the game</a><script>
const button=document.querySelector('button'),status=document.querySelector('#status');
button.onclick=async()=>{button.disabled=true;try{const blobs=[];const parts=["windows-0.part","windows-1.part"];for(let i=0;i<parts.length;i++){status.textContent='Downloading '+(i+1)+' of '+parts.length+'…';const r=await fetch(parts[i]);if(!r.ok)throw Error('Download interrupted. Please retry.');blobs.push(await r.blob());}const url=URL.createObjectURL(new Blob(blobs,{type:'application/zip'}));const a=document.createElement('a');a.href=url;a.download='Last-Exit-Windows.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='Download ready. Check your Downloads folder.';}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};
</script></html>
